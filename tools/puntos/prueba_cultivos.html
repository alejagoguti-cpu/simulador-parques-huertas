<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#bfd4e2;font:12px sans-serif}canvas{display:block}.l{position:absolute;top:470px;width:120px;text-align:center}</style></head><body>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three'; import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const ids = new URLSearchParams(location.search).get('ids').split(','), R = new THREE.WebGLRenderer({ antialias: true }); R.setSize(1800, 520); document.body.appendChild(R.domElement);
const S = new THREE.Scene(); S.add(new THREE.HemisphereLight(0xffffff, 0x556644, 1.6)); const d = new THREE.DirectionalLight(0xffffff, 2); d.position.set(3, 5, 4); S.add(d);
const cam = new THREE.PerspectiveCamera(30, 1800 / 520, 0.01, 100); cam.position.set(0, 2.2, 13); cam.lookAt(0, 0.5, 0);
const L = new GLTFLoader(); let i = 0;
for (const id of ids) { try { const g = await L.loadAsync('../cache/cult/' + id + '.glb'); const b = new THREE.Box3().setFromObject(g.scene), s = 1.2 / Math.max(...b.getSize(new THREE.Vector3()).toArray()); g.scene.scale.setScalar(s); g.scene.position.set(-ids.length * 0.75 + 0.75 + i * 1.5 - b.getCenter(new THREE.Vector3()).x * s, -b.min.y * s, -b.getCenter(new THREE.Vector3()).z * s); S.add(g.scene);
  const t = document.createElement('div'); t.className = 'l'; t.style.left = (i * 1800 / ids.length) + 'px'; t.style.width = (1800 / ids.length) + 'px'; t.textContent = id; document.body.appendChild(t); } catch (e) {} i++; }
R.render(S, cam); window.LISTO = 1;
</script></body></html>
