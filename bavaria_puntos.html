<style>

canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let RMQ = matchMedia('(prefers-reduced-motion: reduce)').matches; const MOV = innerWidth <= 760;
const M = await fetch('data3d/puntos/bavaria_campo.json?v=9').then(r => r.json());
const ESP = M.especies, porK = Object.fromEntries(ESP.map(e => [e.k, e]));
{ const NOM = { cilantro: 'Lavanda', lechuga: 'Lechuga', tomate: 'Tomate', acelga: 'Brócoli', zanahoria: 'Remolacha', eucalipto: 'Árboles existentes' }; for (const k in NOM) if (porK[k]) porK[k].n = NOM[k]; }

/* ---------- las interacciones que se encuadran con el scroll ---------- */
const SEC = [
  ['colibri', 'cilantro', 'Polinización', 'Colibrí', 'Flota frente a las flores de lavanda y toma su néctar; el polen se le pega al pico y lo lleva a la siguiente flor.'],
  ['abeja', 'cilantro', 'Polinización', 'Abeja de miel', 'Viene del apiario del distrito y recorre las hileras de lavanda: poliniza la huerta y produce miel para el mercado.'],
  ['mariposa', 'cilantro', 'Polinización', 'Mariposa', 'Toma néctar de la lavanda. Que llegue es señal de una huerta sin venenos.'],
  ['mariquita', 'lechuga', 'Cuidado de los cultivos', 'Mariquita', 'Recorre las hojas de la lechuga y las mantiene sanas: con ella la huerta no necesita químicos.'],
  ['abejorro', 'tomate', 'Polinización', 'Abejorro', 'El abejorro nativo hace vibrar las flores del tomate para soltar su polen: así hay más tomates.'],
  ['copeton', 'acelga', 'Cuidado de los cultivos', 'Copetón', 'Salta por el sendero de madera entre las hileras, cuidando las plantas y dispersando semillas; anida en los árboles que se conservan.'],
  ['mirla', 'lombriz', 'Depredación', 'Mirla patiamarilla', 'Busca en la tierra húmeda junto a las hileras y saca lombrices e insectos.'],
  ['lombriz', 'zanahoria', 'Suelo vivo', 'Lombriz roja', 'Convierte el compost del distrito en tierra fértil para todos los bancales.'],
  ['murcielago', 'eucalipto', 'Refugio', 'Murciélago', 'Al anochecer sale de los refugios de los árboles y poliniza flores nocturnas.']

$('secs').innerHTML = `<section class="hero" id="s0"><div class="tx"><div class="ey">Bavaria Común desde arriba · huertas de enseñanza</div><h1>Tramas de vida en la huerta</h1>
<p>El predio real de Bavaria Común visto desde arriba (sus edificios, el bosque del censo y los pasajes nuevos) con las huertas de enseñanza en los claros: hileras de cultivos, el sendero de madera, el pabellón de la escuela y el invernadero. Baja con el scroll para descender a la huerta: cada parada encuadra una especie y lo que hace; al final puedes recorrerla.</p>
<a class="baja" href="#s1">Desliza ↓</a></div></section>` +
  SEC.map(([k, b, t, n, d], i) => `<section id="s${i + 1}"><div class="tx"><div class="ey">${String(i + 1).padStart(2, '0')} · ${esc(t)}</div><h2>${esc(n)}</h2><p>${esc(d)}</p>
  <span class="rel"><i style="background:${M.tipos[t] || '#fff'}"></i>${esc(n)} → ${esc((porK[b] || {}).n || '')}</span></div></section>`).join('') +
  `<section id="s${SEC.length + 1}"><div class="tx"><div class="ey">La trama completa</div><h2>${M.rel.length} relaciones entre ${ESP.length} especies</h2>
  <p>Polinizadores, aves que cuidan los cultivos y el suelo vivo trabajan para la huerta; los árboles existentes les dan refugio. Así se enseña a cultivar en Bavaria Común.</p>
  <div class="fin"><button type="button" id="b-rec" class="rec">Recorrer la huerta</button><a href="index.html">Volver al simulador</a><a href="bavaria_interior.html?e=bio">Entrar a los edificios</a></div></div></section>`;
$('prog').innerHTML = Array.from({ length: SEC.length + 2 }, (_, i) => `<a href="#s${i}" aria-label="Sección ${i}"></a>`).join('');
$('nav').innerHTML = [['s0', 'Inicio'], ['s1', 'Polinización'], [`s${SEC.findIndex(s => s[2] === 'Cuidado de los cultivos') + 1}`, 'Cuidado'], [`s${SEC.findIndex(s => s[2] === 'Depredación') + 1}`, 'Suelo y aves'], [`s${SEC.length + 1}`, 'La trama']].map(([h, n]) => `<a href="#${h}">${n}</a>`).join('');

/* ---------- escena de huertas en puntos: se arma en el navegador (data3d/puntos/escena_huerta.js) ---------- */
const { crearEscenaHuerta } = await import('./data3d/puntos/escena_huerta.js?v=13');
const ESC = await crearEscenaHuerta({ THREE, MOV, progreso: (f) => { $('cb').style.width = Math.round(f * 100) + '%'; } });
const OJO = 1.6, n = ESC.n, pos = ESC.pos, col = ESC.col, rnd = new Float32Array(n).map(() => Math.random());
for (let j = 1; j < pos.length; j += 3) pos[j] -= OJO; // el ojo queda en el origen
M.eye = [0, 0, 0]; M.look = [0, -0.1, 1]; M.fov = 56; M.W = 16; M.H = 9;
// las especies, sobre sus plantas de esta escena
const RENOMBRA = { cilantro: ['Lavanda', 'Lavandula angustifolia', 'flor'], lechuga: ['Lechuga', 'Lactuca sativa', 'cultivo'], tomate: ['Tomate', 'Solanum lycopersicum', 'cultivo'], acelga: ['Brócoli', 'Brassica oleracea var. italica', 'cultivo'], zanahoria: ['Remolacha', 'Beta vulgaris', 'cultivo'], eucalipto: ['Árboles existentes', 'bosque de Bavaria', 'arbol'] };
for (const e of ESP) { const a = ESC.anc[e.k]; if (a) e.p = [a[0], a[1] - OJO, a[2]]; const r = RENOMBRA[e.k]; if (r) { e.n = r[0]; e.sci = r[1]; e.g = r[2]; } }
const cv = $('c'), R = new THREE.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: 'high-performance' });
R.setPixelRatio(Math.min(2, devicePixelRatio || 1)); R.setClearColor(0x04070a, 1);
const S = new THREE.Scene(), cam = new THREE.PerspectiveCamera(M.fov, innerWidth / innerHeight, 0.05, 6000);
const U = { uT: { value: 0 }, uPx: { value: R.getPixelRatio() * innerHeight }, uIn: { value: 0 }, uZ: { value: 1 }, uModo: { value: 0 } };
const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.setAttribute('r', new THREE.BufferAttribute(rnd, 1));
// puntos finos, con un velo frío en la distancia (como la referencia) y brillo en los bordes de las hojas
const mat = new THREE.ShaderMaterial({ uniforms: U, vertexColors: true, transparent: true, depthWrite: false,
  vertexShader: `attribute float r; varying vec3 vC; varying float vA; uniform float uT, uPx, uIn, uZ, uModo;
    void main(){ vec3 p = position; float h = fract(r * 91.7);
      p += (vec3(fract(r*13.1), fract(r*7.3), fract(r*3.7)) - 0.5) * 0.002 * length(position);
      if (p.y > 2.0) p.x += sin(uT * 1.1 + p.y * 0.5 + r * 6.0) * 0.012 * (p.y - 2.0); // copas que se mecen
      float rise = smoothstep(r * 0.6, r * 0.6 + 0.4, uIn); p.y -= (1.0 - rise) * (2.0 + r * 6.0);
      vec4 mv = modelViewMatrix * vec4(p, 1.0); gl_Position = projectionMatrix * mv; float d = -mv.z;
      gl_PointSize = clamp(uPx * 0.0021 * uZ * (0.8 + h * 0.5) / max(d, 0.1) * 6.0, 1.2, 6.0 * uZ);
      float lejos = smoothstep(45.0, 900.0, d); vec3 c = color * (0.84 + h * 0.3);
      c = mix(c, vec3(0.5, 0.72, 0.7) * (0.55 + dot(color, vec3(.33))), lejos * 0.28); // velo frío a lo lejos
      vC = c * mix(1.0, 0.7, smoothstep(200.0, 1200.0, d)); vA = rise * mix(1.0, 0.6, lejos);
      float lum = dot(color, vec3(0.3, 0.55, 0.15)), vivo = clamp((color.g - max(color.r, color.b)) * 4.0 + 0.2, 0.0, 1.0);
      if (uModo > 0.5 && uModo < 1.5) { gl_PointSize *= 2.6; vA = rise; vC = color * (0.92 + h * 0.16) * mix(1.0, 0.8, smoothstep(200.0, 1200.0, d)); }
      if (uModo > 1.5 && uModo < 2.5) { float t = clamp(d / 260.0, 0.0, 1.0); vec3 c1 = vec3(1.0, 0.55, 0.18), c2 = vec3(0.2, 0.85, 0.75), c3 = vec3(0.15, 0.25, 0.75);
        vC = (t < 0.35 ? mix(c1, c2, t / 0.35) : mix(c2, c3, (t - 0.35) / 0.65)) * (0.55 + 0.45 * lum) * (0.8 + 0.4 * step(0.985, fract(d * 0.25))); vA = rise; }
      if (uModo > 2.5 && uModo < 3.5) { vC = vec3(0.55, 0.78, 1.0) * (0.35 + 0.65 * lum); vA = rise * 0.16; }
      if (uModo > 3.5 && uModo < 4.5) { float k = clamp(vivo * 0.75 + lum * 0.35 + h * 0.08, 0.0, 1.0);
        vC = k < 0.33 ? mix(vec3(0.03, 0.0, 0.12), vec3(0.55, 0.0, 0.6), k / 0.33) : k < 0.66 ? mix(vec3(0.55, 0.0, 0.6), vec3(1.0, 0.35, 0.0), (k - 0.33) / 0.33) : mix(vec3(1.0, 0.35, 0.0), vec3(1.0, 0.95, 0.55), (k - 0.66) / 0.34); gl_PointSize *= 1.6; vA = rise; }
      if (uModo > 4.5) { float g2 = (0.25 + 1.1 * lum) * (0.85 + 0.3 * fract(sin(dot(position.xz, vec2(12.9, 78.2)) + uT * 30.0) * 43758.5)); vC = vec3(0.25, 1.0, 0.35) * g2; gl_PointSize *= 1.5; vA = rise; } }`,
  fragmentShader: `varying vec3 vC; varying float vA; void main(){ vec2 q = gl_PointCoord - 0.5; float d = dot(q, q); if (d > 0.25) discard; gl_FragColor = vec4(vC, vA * smoothstep(0.25, 0.1, d));
    #include <colorspace_fragment>
  }` });
const NUBEP = new THREE.Points(g, mat); S.add(NUBEP);
/* ---------- la misma escena en MALLAS 3D para las otras visiones (data3d/puntos/escena_mallas.js) ---------- */
R.shadowMap.enabled = !MOV; R.shadowMap.type = THREE.PCFSoftShadowMap; R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.05;
const { crearEscenaMallas } = await import('./data3d/puntos/escena_mallas.js?v=7');
const MAL = await crearEscenaMallas({ THREE, geo: ESC.geo, sombras: !MOV, movil: MOV }); MAL.grupo.position.y = -OJO; MAL.grupo.visible = false; S.add(MAL.grupo);

/* ---------- especies en PUNTOS desde fotografías (tools/puntos/especies_puntos.py) ---------- */
const EI = await fetch('data3d/puntos/esp/esp.json?v=1').then(r => r.json()).catch(() => ({}));
const NUBE = {}; await Promise.all(Object.keys(EI).map(async k => { const b = new Uint8Array(await fetch(`data3d/puntos/esp/${k}.bin?v=1`).then(r => r.arrayBuffer())); NUBE[k] = { n: EI[k].n, q: new Int16Array(b.buffer, 0, EI[k].n * 3), c: b.subarray(EI[k].n * 6) }; }));

let FONDO = 0x04070a;

/* ---------- RECORRER: caminar libre por la huerta ---------- */
const lib = { on: false, x: 0, z: 0, yaw: 0, pitch: -0.1, k: {}, drag: null };

const V = new THREE.Vector3(), V2 = new THREE.Vector3(); let t0 = performance.now(), tPrev = t0, secAct = -1;

      $('inset').style.left = '55%'; } }

    { const ag2 = SEL[kk]; if (ag2) { const r = $('inset').getBoundingClientRect(), dpr = R.getPixelRatio(), s2 = TAM[kk] || 0.2, d = Math.max(0.35, s2 * 4.5);

        const u0 = U.uPx.value, uz = U.uZ.value; U.uPx.value = r.height * dpr * 0.9; U.uZ.value = 1.6;
